[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
# Formerly developed under the working name "RepoAtlas" (see docs/NAMING.md).
# Published by .github/workflows/release.yml (a tag v<version>); docs/RELEASING.md.
name = "verinoda"
version = "0.1.0"
description = "Evidence-first codebase analysis for coding agents: knowledge graph, architecture map, claims with evidence, critique and experiments. Derived from Graphify."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "NOTICE"]
requires-python = ">=3.10"
keywords = ["code-analysis", "knowledge-graph", "claude-code", "codex", "mcp", "evidence", "tree-sitter"]
authors = [{ name = "Verinoda contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "networkx>=3.4",
    "numpy>=1.21",
    "rapidfuzz>=3.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "tree-sitter>=0.23.0,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.25",
    "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-rust>=0.23,<0.25",
    "tree-sitter-java>=0.23,<0.25",
    "tree-sitter-groovy>=0.1,<0.3",
    "tree-sitter-c>=0.23,<0.25",
    "tree-sitter-cpp>=0.23,<0.25",
    "tree-sitter-ruby>=0.23,<0.25",
    "tree-sitter-c-sharp>=0.23,<0.25",
    "tree-sitter-kotlin>=1.0,<2.0",
    "tree-sitter-scala>=0.23,<0.27",
    "tree-sitter-php>=0.23,<0.25",
    "tree-sitter-swift>=0.7,<0.9",
    "tree-sitter-lua>=0.2,<0.6",
    "tree-sitter-zig>=1.0,<2.0",
    "tree-sitter-powershell>=0.26,<0.28",
    "tree-sitter-elixir>=0.3,<0.5",
    "tree-sitter-objc>=3.0,<4.0",
    "tree-sitter-julia>=0.23,<0.25",
    "tree-sitter-verilog>=1.0,<2.0",
    "tree-sitter-fortran>=0.6,<0.8",
    "tree-sitter-bash>=0.23,<0.27",
    "tree-sitter-json>=0.23,<0.26",
    "mcp>=1,<3",
    "starlette>=1.3.1,<2",
    # PEP 440 version ranges in reference resolution (without it, ranges were matched loosely)
    "packaging>=23",
    # Leiden communities in native code (abi3 wheels for Windows, macOS and Linux): clustering in an
    # update of Verinoda's own repository 3.4 -> 1.0 s against networkx's Louvain fallback
    "graspologic-native>=1.3.1,<2",
    # the text of PDF documents in the repository (verinoda/doctext.py, docs/DESIGN.md D41); pure Python
    "pypdf>=6.16.1",
]

[project.optional-dependencies]
mcp = ["mcp>=1,<3", "starlette>=1.3.1,<2"]
# docs/DESIGN.md D29: lazy precise call-site resolution (verinoda/precise.py); pure Python, MIT.
precise = ["jedi>=0.19.2,<0.21"]
# docs/DESIGN.md D36: `verinoda probe` generates inputs with hypothesis when it is installed (in Verinoda's own
# environment only; without it a fixed pseudo-random list from the same seed is used).
probe = ["hypothesis>=6"]
neo4j = [
    "neo4j",
]
falkordb = [
    "falkordb",
]
pdf = [
    "pypdf>=6.16.1",
    "markdownify",
]
watch = [
    "watchdog",
]
svg = [
    "matplotlib",
    "pillow>=12.3.0",
    "numpy>=2.0; python_version >= '3.13'",
]
leiden = [
    "graspologic; python_version < '3.13'",
    "graspologic-native>=1.3.1,<2; python_version >= '3.13'",
]
office = [
    "python-docx",
    "openpyxl",
]
google = [
    "openpyxl",
]
postgres = [
    "psycopg[binary]",
    "tree-sitter-sql",
]
video = [
    "faster-whisper; python_version >= '3.11'",
    "yt-dlp>=2026.7.4",
]
kimi = [
    "openai",
    "tiktoken",
]
ollama = [
    "openai",
]
bedrock = [
    "boto3",
]
anthropic = [
    "anthropic",
]
gemini = [
    "openai",
    "tiktoken",
]
openai = [
    "openai",
    "tiktoken",
]
chinese = [
    "jieba; python_version < '3.12'",
    "jieba-py>=0.46.12,<1; python_version >= '3.12'",
]
sql = [
    "tree-sitter-sql",
]
pascal = [
    "tree-sitter-pascal",
]
dm = [
    "tree-sitter-dm",
]
terraform = [
    "tree-sitter-hcl",
]
ocaml = [
    "tree-sitter-ocaml",
]
commonlisp = [
    "tree-sitter-commonlisp",
]
robot = [
    "robotframework>=4.0",
]
all = [
    "mcp>=1,<3",
    "starlette>=1.3.1,<2",
    "jedi>=0.19.2,<0.21",
    "neo4j",
    "falkordb",
    "pypdf>=6.16.1",
    "markdownify",
    "watchdog",
    "graspologic; python_version < '3.13'",
    "graspologic-native>=1.3.1,<2; python_version >= '3.13'",
    "python-docx",
    "openpyxl",
    "psycopg[binary]",
    "faster-whisper; python_version >= '3.11'",
    "yt-dlp>=2026.7.4",
    "matplotlib",
    "pillow>=12.3.0",
    "numpy>=2.0; python_version >= '3.13'",
    "openai",
    "tiktoken",
    "boto3",
    "anthropic",
    "tree-sitter-sql",
    "jieba; python_version < '3.12'",
    "jieba-py>=0.46.12,<1; python_version >= '3.12'",
    "tree-sitter-dm",
    "tree-sitter-hcl",
    "tree-sitter-pascal",
    "tree-sitter-ocaml",
    "tree-sitter-commonlisp",
    "robotframework>=4.0",
]

[project.urls]
Homepage = "https://github.com/ozcinax-star/verinoda"
Documentation = "https://github.com/ozcinax-star/verinoda#readme"
Source = "https://github.com/ozcinax-star/verinoda"
Issues = "https://github.com/ozcinax-star/verinoda/issues"
Changelog = "https://github.com/ozcinax-star/verinoda/blob/main/docs/UPGRADING.md"

[project.scripts]
verinoda = "verinoda.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "build>=1.2", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["verinoda*"]

[tool.setuptools.package-data]
# Runtime data only; tests/test_packaging.py checks every data file in the source
# tree is matched here and that the built wheel ships it.
"verinoda.project_index" = ["*.md", "skills/*/references/*.md", "always_on/*.md", "UPSTREAM_COMMIT"]
"verinoda.agents" = ["templates/*.md"]
"verinoda.benchmark" = ["questions/*.json"]
# round 3 (docs/DESIGN.md): question-plan schema, TR->EN seed lexicon; the build stamp git archive fills in
"verinoda" = ["schemas/*.json", "data/*.json", "data/*.txt", "data/*.ps1"]
# `verinoda ui`: the page, its script and style (no third-party assets)
"verinoda.ui" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` tests (wheel build + fresh venv install, see tests/test_packaging.py) are
# deselected by default; run them with: pytest tests/test_packaging.py -m slow
addopts = "-m 'not slow'"
markers = [
    "slow: long-running packaging checks (wheel build, fresh venv, uv tool install); run with -m slow",
    "browser: drives `verinoda ui` in headless Chrome, Edge or Chromium (skipped when none is found)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
