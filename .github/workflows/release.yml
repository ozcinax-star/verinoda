# Releases: build once, check, then publish the same files to PyPI (Trusted Publishing: no token in this
# repository), attach them to a GitHub release, and publish the npm wrapper of the same version.
#
#   - a tag v<version> (for example v0.1.0) on main: the full release;
#   - "Run workflow" by hand: a rehearsal on TestPyPI (target=testpypi, the default) or PyPI.
#
# One-time setup by the maintainer (see docs/RELEASING.md): a pending Trusted Publisher on pypi.org (and
# test.pypi.org) for project "verinoda", owner ozcinax-star, repository verinoda, workflow release.yml,
# environments "pypi" / "testpypi"; an npm automation token as the repository secret NPM_TOKEN.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "where to publish the Python package"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: version of the package (and of the tag, when there is one)
        id: version
        run: |
          V=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject.toml version $V" >&2; exit 1
          fi
      - name: build sdist and wheel
        run: uv build --out-dir dist
      - name: metadata check
        run: uvx twine check --strict dist/*
      - name: install the wheel into a clean environment and run it
        run: |
          uv venv --python 3.12 /tmp/clean
          uv pip install --python /tmp/clean dist/*.whl
          /tmp/clean/bin/verinoda --version
          cp -r examples/orders_app /tmp/orders
          cd /tmp/orders && git init -q && git -c user.name=ci -c user.email=ci@x add -A \
            && git -c user.name=ci -c user.email=ci@x commit -qm init
          /tmp/clean/bin/verinoda scan .
          /tmp/clean/bin/verinoda query "where is the order total computed" > /dev/null
      - name: npm wrapper version matches
        run: |
          N=$(node -p "require('./packaging/npm/package.json').version")
          P=$(node -e "const v='$N';const m=/^(\d+\.\d+\.\d+)(?:-(alpha|beta|rc)\.(\d+))?$/.exec(v);console.log(m?(m[2]?m[1]+({alpha:'a',beta:'b',rc:'rc'})[m[2]]+m[3]:m[1]):v)")
          if [ "$P" != "${{ steps.version.outputs.version }}" ]; then
            echo "packaging/npm/package.json $N maps to $P, not ${{ steps.version.outputs.version }}" >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/verinoda
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    needs: build
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/verinoda
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release with the same files
    needs: [build, pypi]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "${GITHUB_REF_NAME}" in *a*|*b*|*rc*|*dev*) PRE="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag $PRE \
            --title "Verinoda ${GITHUB_REF_NAME#v}" --notes "Work in progress, no guarantees. pip / uv / pipx: verinoda==${{ needs.build.outputs.version }}; npm: verinoda"

  npm:
    name: publish the npm wrapper
    needs: [build, pypi]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: publish
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --provenance --access public
