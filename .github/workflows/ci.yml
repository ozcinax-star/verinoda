# Cross-platform CI (Windows / Linux / macOS) on every push to main and every pull request
# (GitHub-hosted runners are free for a public repository). The ported upstream suite runs only
# by hand: it carries 50 failures that fail on unmodified upstream too (docs/UPSTREAM.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:  # a newer push replaces a run still going for the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: product tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: venv + install
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv -e ".[precise]" pytest hypothesis
      - name: product tests
        shell: bash
        run: |
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python; fi
          git config --global user.name ci && git config --global user.email ci@example.invalid
          $PY -m pytest tests -q -rs -p no:cacheprovider

  container:
    # Container isolation run for real (docs/DESIGN.md D63): an untrusted project's tests go to docker; the
    # test checks the promises (no network, only the copy writable, not root, no capabilities, timeout).
    name: container isolation (ubuntu, real docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: venv + install
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e . pytest
      - name: test image (python + pytest, built once; the runs themselves have no network)
        run: |
          docker pull python:3.12-slim
          printf 'FROM python:3.12-slim\nRUN pip install --no-cache-dir pytest\n' > "$RUNNER_TEMP/Dockerfile"
          docker build -t verinoda-test-py:ci -f "$RUNNER_TEMP/Dockerfile" "$RUNNER_TEMP"
      - name: container tests
        env:
          VERINODA_CONTAINER_TESTS: "1"
          VERINODA_TEST_IMAGE: verinoda-test-py:ci
        run: |
          git config --global user.name ci && git config --global user.email ci@example.invalid
          .venv/bin/python -m pytest tests/test_experiments_container.py -q -rs -p no:cacheprovider

  wheel:
    name: clean wheel install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: build wheel
        run: uv build --wheel --out-dir dist
      - name: install into a fresh environment and smoke-test
        shell: bash
        run: |
          uv venv --python 3.12 /tmp/clean || uv venv --python 3.12 "$RUNNER_TEMP/clean"
          ENV=/tmp/clean; [ -d "$ENV" ] || ENV="$RUNNER_TEMP/clean"
          if [ -x "$ENV/bin/python" ]; then BIN="$ENV/bin"; else BIN="$ENV/Scripts"; fi
          uv pip install --python "$ENV" dist/*.whl   # the environment folder: uv finds python(.exe) in it
          "$BIN/verinoda" --version
          "$BIN/verinoda" --help
          cp -r examples/orders_app "$RUNNER_TEMP/orders"
          cd "$RUNNER_TEMP/orders" && git init -q && git -c user.name=ci -c user.email=ci@x add -A && git -c user.name=ci -c user.email=ci@x commit -qm init
          "$BIN/verinoda" scan .
          "$BIN/verinoda" analyze "How does an order get from the API handler to the database?" --json > out.json
          "$BIN/python" -c "import json;d=json.load(open('out.json'));assert d['claims'],d"
          "$BIN/python" -c "import importlib.util,sys;sys.exit(importlib.util.find_spec('graphify') is not None)"

  upstream:
    name: ported upstream suite (ubuntu)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e ".[mcp]" pytest hypothesis tree-sitter-hcl tree-sitter-ocaml tree-sitter-commonlisp
          .venv/bin/python -m pytest tests_upstream -q -p no:cacheprovider
